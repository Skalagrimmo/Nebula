name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

# Скасовує застарілі запуски для тієї ж гілки — економить хвилини CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Build and run unit tests
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace 2>&1 | tee gradle-output.log

      - name: Report build failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let tail = 'log file not found';
            try {
              const log = fs.readFileSync('gradle-output.log', 'utf8');
              const lines = log.split('\n');
              const idx = lines.findIndex(l => l.includes('FAILED') || l.includes('error:'));
              const start = idx >= 0 && idx > 200 ? idx - 200 : Math.max(0, lines.length - 500);
              tail = lines.slice(start).join('\n').slice(-60000);
            } catch (e) { tail = String(e); }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI diagnostic: build failure @ ${context.sha.slice(0, 7)}`,
              body: 'Gradle output tail:\n\n```\n' + tail + '\n```'
            });

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: nebula4x-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
