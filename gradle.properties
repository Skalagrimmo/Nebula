# Project-wide Gradle settings.
# Specifies the JVM arguments used by the daemon process.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Incubating parallel mode for decoupled projects.
org.gradle.parallel=true
# Kotlin code style: "official" or "obsolete".
kotlin.code.style=official
# Namespace each library's R class to its own resources.
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Maximum workers to avoid overloading the machine.
org.gradle.workers.max=4
# Compile Kotlin in-process to avoid daemon connection issues.
kotlin.compiler.execution.strategy=in-process
